<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for US Navy: a line-drawn fouled anchor on dress navy.
       Stand-in until Franklin's baked pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#274b73"/>
      <stop offset="0.6" stop-color="#1b3a5c"/>
      <stop offset="1" stop-color="#081424"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- faint diagonal weave -->
  <g stroke="#eef2f5" stroke-width="10" opacity="0.04">
    <line x1="-60" y1="420" x2="240" y2="120"/>
    <line x1="-20" y1="460" x2="280" y2="160"/>
    <line x1="-100" y1="380" x2="200" y2="80"/>
    <line x1="60" y1="500" x2="360" y2="200"/>
  </g>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- line-drawn fouled anchor -->
  <g stroke="#e8d488" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <circle cx="150" cy="128" r="20"/>
    <path d="M150 148 L150 292"/>
    <path d="M104 176 L196 176"/>
    <path d="M84 236 C84 292 116 314 150 314 C184 314 216 292 216 236"/>
    <path d="M84 236 L66 254 M84 236 L102 254"/>
    <path d="M216 236 L198 254 M216 236 L234 254"/>
    <!-- rope fouling across the shank -->
    <path d="M128 196 C160 186 140 222 172 212" stroke-width="5" opacity="0.8"/>
    <path d="M126 244 C158 234 142 268 174 258" stroke-width="5" opacity="0.8"/>
  </g>
  <text x="150" y="362" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#eef2f5" opacity="0.9">US NAVY</text>
  <text x="150" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="4" fill="#eef2f5" opacity="0.65">PACKRIPPER</text>
</svg>

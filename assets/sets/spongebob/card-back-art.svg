<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for SpongeBob: a porous sponge square among
       rising bubbles on deep sea blue. Stand-in until Franklin's baked
       pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b84c9"/>
      <stop offset="0.6" stop-color="#2674b8"/>
      <stop offset="1" stop-color="#174e7d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#ffe135" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe135" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- rising bubbles -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5">
    <circle cx="42" cy="330" r="10"/>
    <circle cx="66" cy="268" r="6"/>
    <circle cx="38" cy="205" r="13"/>
    <circle cx="70" cy="130" r="7"/>
    <circle cx="48" cy="66" r="10"/>
    <circle cx="258" cy="345" r="7"/>
    <circle cx="238" cy="282" r="12"/>
    <circle cx="262" cy="215" r="6"/>
    <circle cx="232" cy="148" r="9"/>
    <circle cx="258" cy="82" r="12"/>
    <circle cx="150" cy="368" r="6"/>
    <circle cx="150" cy="46" r="8"/>
  </g>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- sponge square -->
  <g opacity="0.95">
    <rect x="95" y="150" width="110" height="110" rx="14" fill="#ffe135" stroke="#e8b90e" stroke-width="5"/>
    <g fill="#e8b90e" opacity="0.75">
      <circle cx="122" cy="178" r="8"/>
      <circle cx="162" cy="168" r="5"/>
      <circle cx="182" cy="192" r="9"/>
      <circle cx="132" cy="212" r="6"/>
      <circle cx="168" cy="228" r="7"/>
      <circle cx="112" cy="238" r="5"/>
      <circle cx="190" cy="238" r="4"/>
    </g>
    <!-- eyes -->
    <circle cx="132" cy="196" r="10" fill="#ffffff"/>
    <circle cx="168" cy="196" r="10" fill="#ffffff"/>
    <circle cx="132" cy="198" r="4.5" fill="#174e7d"/>
    <circle cx="168" cy="198" r="4.5" fill="#174e7d"/>
    <!-- smile -->
    <path d="M126 226 Q150 246 174 226" fill="none" stroke="#92680a" stroke-width="5" stroke-linecap="round"/>
    <!-- pants band -->
    <rect x="95" y="246" width="110" height="14" rx="4" fill="#8a5a2b"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for Wild Mammals: a line-drawn paw print on savanna gold-brown.
       Stand-in until Franklin's baked pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4f16"/>
      <stop offset="0.6" stop-color="#54400f"/>
      <stop offset="1" stop-color="#241a06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#a67c2e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a67c2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- diagonal savanna stripes -->
  <g stroke="#f6e4be" stroke-width="10" opacity="0.05">
    <line x1="-60" y1="420" x2="240" y2="120"/>
    <line x1="-20" y1="460" x2="280" y2="160"/>
    <line x1="-100" y1="380" x2="200" y2="80"/>
    <line x1="60" y1="500" x2="360" y2="200"/>
  </g>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- line-drawn paw print: four toes over a broad pad -->
  <g fill="none" stroke="#f6e4be" stroke-width="7" stroke-linecap="round" opacity="0.92">
    <ellipse cx="82" cy="150" rx="17" ry="24" transform="rotate(-18 82 150)"/>
    <ellipse cx="126" cy="128" rx="17" ry="25" transform="rotate(-6 126 128)"/>
    <ellipse cx="174" cy="128" rx="17" ry="25" transform="rotate(6 174 128)"/>
    <ellipse cx="218" cy="150" rx="17" ry="24" transform="rotate(18 218 150)"/>
    <path d="M96 246 C96 214 122 198 150 198 C178 198 204 214 204 246 C204 272 180 282 150 282 C120 282 96 272 96 246 Z"/>
  </g>
  <!-- grass blades along the foot -->
  <g stroke="#e0b45c" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M28 420 C30 392 24 372 14 356"/>
    <path d="M48 420 C52 396 52 374 46 354"/>
    <path d="M252 420 C250 394 256 372 266 356"/>
    <path d="M232 420 C230 398 234 376 244 358"/>
  </g>
</svg>

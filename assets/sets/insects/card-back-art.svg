    <line x1="150" y1="182" x2="150" y2="252"/>
    <path d="M150 182 C138 158 122 148 108 144"/>
    <path d="M150 182 C162 158 178 148 192 144"/>
  </g>
  <g fill="#f6f3e4" opacity="0.92">

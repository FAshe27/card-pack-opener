<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840">
  <!-- Placeholder card back for the Candy set: a wrapped hard candy over
       pink/purple foil stripes. Pure vector stand-in until Franklin's
       baked pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5488c"/>
      <stop offset="0.55" stop-color="#c22a72"/>
      <stop offset="1" stop-color="#7b3fbf"/>
    </linearGradient>
    <linearGradient id="wrap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd65a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="600" height="840" fill="url(#bg)"/>
  <g opacity="0.16" fill="#ffffff">
    <rect x="-80" y="60" width="46" height="900" transform="rotate(18 0 0)"/>
    <rect x="60" y="60" width="46" height="900" transform="rotate(18 0 0)"/>
    <rect x="340" y="60" width="46" height="900" transform="rotate(18 0 0)"/>
    <rect x="480" y="60" width="46" height="900" transform="rotate(18 0 0)"/>
  </g>
  <g opacity="0.85" fill="#fff6ec">
    <circle cx="90" cy="120" r="5"/><circle cx="520" cy="180" r="4"/>
    <circle cx="140" cy="700" r="4"/><circle cx="480" cy="660" r="5"/>
    <circle cx="300" cy="90" r="4"/><circle cx="60" cy="420" r="4"/>
    <circle cx="545" cy="430" r="4"/><circle cx="250" cy="760" r="5"/>
  </g>
  <!-- wrapper tails -->
  <path d="M212 420 L96 356 L120 420 L96 484 Z" fill="url(#wrap)"/>
  <path d="M388 420 L504 356 L480 420 L504 484 Z" fill="url(#wrap)"/>
  <!-- candy body -->
  <circle cx="300" cy="420" r="104" fill="url(#wrap)"/>
  <path d="M300 316 a104 104 0 0 1 0 208 a130 130 0 0 1 0 -208" fill="#ffffff" opacity="0.18"/>
  <path d="M262 348 a86 86 0 0 1 66 -18 l-28 76 z" fill="#e5488c" opacity="0.85"/>
  <path d="M340 508 a86 86 0 0 1 -68 16 l28 -76 z" fill="#e5488c" opacity="0.85"/>
  <path d="M238 452 a86 86 0 0 1 -14 -64 l76 28 z" fill="#7b3fbf" opacity="0.55"/>
  <path d="M364 388 a86 86 0 0 1 12 66 l-76 -28 z" fill="#7b3fbf" opacity="0.55"/>
  <text x="300" y="622" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="54" font-weight="bold" fill="#fff6ec" letter-spacing="6">CANDY</text>
  <text x="300" y="668" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="25" fill="#ffd7ea" letter-spacing="10">🍬 PACK 🍬</text>
</svg>

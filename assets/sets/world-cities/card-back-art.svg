<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for World Cities: skyline silhouette over a dusk gradient.
       Stand-in until Franklin's baked pack art replaces it. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e4057"/>
      <stop offset="0.62" stop-color="#24344b"/>
      <stop offset="1" stop-color="#16222f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.98" r="0.75">
      <stop offset="0" stop-color="#e8873a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e8873a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#sky)"/>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- stars / high windows -->
  <g fill="#ffe2aa">
    <circle cx="30" cy="36" r="2.4"/><circle cx="82" cy="22" r="2"/><circle cx="128" cy="40" r="2.4"/>
    <circle cx="176" cy="24" r="2"/><circle cx="222" cy="38" r="2.4"/><circle cx="262" cy="22" r="2"/>
    <circle cx="56" cy="66" r="1.8"/><circle cx="150" cy="68" r="1.8"/><circle cx="244" cy="64" r="1.8"/>
  </g>
  <!-- skyline silhouette -->
  <g fill="#0d1622">
    <rect x="0" y="268" width="34" height="152"/>
    <rect x="30" y="232" width="28" height="188"/>
    <rect x="54" y="286" width="22" height="134"/>
    <rect x="72" y="206" width="30" height="214"/>
    <rect x="98" y="252" width="24" height="168"/>
    <rect x="118" y="182" width="26" height="238"/>
    <rect x="140" y="238" width="22" height="182"/>
    <rect x="158" y="214" width="30" height="206"/>
    <rect x="184" y="262" width="24" height="158"/>
    <rect x="204" y="196" width="28" height="224"/>
    <rect x="228" y="246" width="22" height="174"/>
    <rect x="246" y="224" width="26" height="196"/>
    <rect x="268" y="276" width="32" height="144"/>

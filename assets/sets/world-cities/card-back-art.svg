    <rect x="38" y="248" width="4" height="5"/><rect x="48" y="266" width="4" height="5"/><rect x="38" y="290" width="4" height="5"/>
    <rect x="80" y="224" width="4" height="5"/><rect x="90" y="248" width="4" height="5"/><rect x="80" y="276" width="4" height="5"/><rect x="90" y="306" width="4" height="5"/>
    <rect x="124" y="200" width="4" height="5"/><rect x="134" y="226" width="4" height="5"/><rect x="124" y="256" width="4" height="5"/><rect x="134" y="288" width="4" height="5"/>
    <rect x="166" y="232" width="4" height="5"/><rect x="176" y="258" width="4" height="5"/><rect x="166" y="292" width="4" height="5"/>
    <rect x="210" y="214" width="4" height="5"/><rect x="220" y="240" width="4" height="5"/><rect x="210" y="272" width="4" height="5"/><rect x="220" y="304" width="4" height="5"/>
    <rect x="252" y="242" width="4" height="5"/><rect x="262" y="268" width="4" height="5"/><rect x="252" y="296" width="4" height="5"/>

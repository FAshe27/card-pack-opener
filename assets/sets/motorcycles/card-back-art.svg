<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for Motorcycles: a line-drawn motorcycle on burnt rust.
       Stand-in until Franklin's baked pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b34a26"/>
      <stop offset="0.6" stop-color="#a63d21"/>
      <stop offset="1" stop-color="#571d0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#2e4a5a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2e4a5a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- diagonal road stripes -->
  <g stroke="#f4efe8" stroke-width="10" opacity="0.05">
    <line x1="-60" y1="420" x2="240" y2="120"/>
    <line x1="-20" y1="460" x2="280" y2="160"/>
    <line x1="-100" y1="380" x2="200" y2="80"/>
    <line x1="60" y1="500" x2="360" y2="200"/>
  </g>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- line-drawn motorcycle -->
  <g stroke="#f4efe8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <circle cx="88" cy="272" r="34"/>
    <circle cx="216" cy="272" r="34"/>
    <path d="M88 272 L132 224 L178 224 L216 272"/>
    <path d="M132 224 L118 272"/>
    <path d="M150 204 L196 204 L216 272"/>
    <path d="M196 204 L206 182 L224 178"/>
    <path d="M118 210 L152 210"/>
  </g>
  <g fill="#f4efe8" opacity="0.92">
    <circle cx="88" cy="272" r="7"/>
    <circle cx="216" cy="272" r="7"/>
  </g>
  <text x="150" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#f4efe8" opacity="0.9">MOTORCYCLES</text>
  <text x="150" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="4" fill="#f4efe8" opacity="0.65">PACKRIPPER</text>
</svg>

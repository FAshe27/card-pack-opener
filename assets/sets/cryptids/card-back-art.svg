<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder card back for Cryptids & Mythology: a line-drawn dragon on deep forest green.
       Stand-in until Franklin's baked pack art replaces it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4630"/>
      <stop offset="0.6" stop-color="#14301f"/>
      <stop offset="1" stop-color="#08170e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#2e5c3a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#2e5c3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="420" fill="url(#bg)"/>
  <!-- diagonal forest stripes -->
  <g stroke="#d6e8dc" stroke-width="10" opacity="0.05">
    <line x1="-60" y1="420" x2="240" y2="120"/>
    <line x1="-20" y1="460" x2="280" y2="160"/>
    <line x1="-100" y1="380" x2="200" y2="80"/>
    <line x1="60" y1="500" x2="360" y2="200"/>
  </g>
  <rect width="300" height="420" fill="url(#glow)"/>
  <!-- line-drawn dragon: wing, neck and curled tail -->
  <g stroke="#d6e8dc" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92">
    <path d="M150 236 C118 200 96 168 104 132 C130 158 158 172 186 176 C164 196 156 214 158 238"/>
    <path d="M104 132 C128 128 150 134 164 148"/>
    <path d="M158 238 C176 262 172 292 146 300 C122 307 104 288 114 268 C122 252 144 254 146 270"/>
    <path d="M150 236 C168 250 196 254 214 244 L226 258 L222 238 C236 228 240 210 232 196"/>
    <path d="M232 196 L244 188 L234 182"/>
  </g>
  <g fill="#d6e8dc" opacity="0.92">
    <circle cx="104" cy="132" r="6"/>
    <circle cx="232" cy="196" r="6"/>
  </g>
  <text x="150" y="356" text-anchor="middle" font-family="Georgia, serif" font-size="25" letter-spacing="6" fill="#d6e8dc" opacity="0.9">CRYPTIDS</text>
  <text x="150" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="4" fill="#d6e8dc" opacity="0.65">PACKRIPPER</text>
